:root{--bg:#f6efe2;--bg2:#ecdfc4;--ink:#12343b;--mut:#6b7a7d;--card:rgba(255,255,255,.66);--line:rgba(18,52,59,.14);--gold:#b8860b;--teal:#1f6f7a;--rose:#ad5a3b;--ok:#2e7d4f;--slate:#5b6b73;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a181c;--bg2:#12302f;--ink:#f1e8d4;--mut:#93a6a8;--card:rgba(255,255,255,.06);--line:rgba(241,232,212,.14);--gold:#e3b341;--teal:#4fc3c9;--rose:#e58f6f;--ok:#6fd39a;--slate:#9db0b4;--on:#0a181c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a181c;--bg2:#12302f;--ink:#f1e8d4;--mut:#93a6a8;--card:rgba(255,255,255,.06);--line:rgba(241,232,212,.14);--gold:#e3b341;--teal:#4fc3c9;--rose:#e58f6f;--ok:#6fd39a;--slate:#9db0b4;--on:#0a181c;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Tajawal,Tahoma,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;position:relative;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none}
body:before{width:46vmax;height:46vmax;background:var(--gold);top:-18vmax;left:-12vmax;opacity:.28}
body:after{width:42vmax;height:42vmax;background:var(--teal);bottom:-16vmax;right:-10vmax;opacity:.30}
main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand h1{font-family:"Aref Ruqaa",Tajawal,serif;font-size:clamp(30px,6vw,46px);margin:0;line-height:1.1;background:linear-gradient(90deg,var(--gold),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:2px 0 0;color:var(--mut);font-size:14px}
.tools{display:flex;gap:8px}
.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;backdrop-filter:blur(10px);transition:.2s}
.btn:hover{transform:translateY(-2px);border-color:var(--gold)}
.btn.gold{background:linear-gradient(90deg,var(--gold),var(--teal));color:var(--on);border:0;font-weight:700}
.glass{background:var(--card);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px -18px rgba(0,0,0,.35)}

<div class="ov" id="ov"><div class="glass"><h2 style="margin:0 0 6px">نسخة احتياطية</h2><p class="sub">بياناتك على هذا الهاتف فقط. شارك نسخة عبر واتساب أو جيميل أو Drive، واستعدها بزر استيراد بعد اختيار الملف.</p><textarea id="bk"></textarea><input type="file" id="fi" accept=".json,application/json" style="margin-top:8px"><div class="add"><button class="btn gold" data-a="exp">مشاركة نسخة</button><button class="btn" data-a="imp">استيراد</button><button class="btn" data-a="cls">إغلاق</button></div><p class="sub" id="bm"></p></div></div>
<script>

S.w=S.w||W.slice();S.m=S.m||'n';S.th=S.th||.8;S.nx=S.nx||'';S.n=(S.n||[]).map(x=>x.t===undefined?x:{id:x.id,b:(x.t?x.t+'\n':'')+(x.b||''),p:x.p||0,u:x.u||Date.now()});S.c.r=S.c.r||0;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let arm=0;

const last4=a.filter(x=>!x.r).slice(-4),avg=last4.length?last4.reduce((x,y)=>x+y.t,0)/last4.length:0;

<div class="top"><div class="brand"><h1>ديوان التشغيل</h1><p>الأسبوع من ${fd(c.s)} إلى ${fd(addD(c.s,6))}</p></div><div class="tools"><button class="btn" data-a="bk">نسخة احتياطية</button><button class="btn" data-a="th">◐</button></div></div>

<section class="glass hero"><div class="dial"><svg viewBox="0 0 240 240"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--gold)"/><stop offset="1" stop-color="var(--teal)"/></linearGradient></defs><circle cx="120" cy="120" r="112" fill="none" stroke="var(--line)" stroke-dasharray="2 7"/><circle cx="120" cy="120" r="96" fill="none" stroke="var(--line)" stroke-width="16"/><circle class="arc" cx="120" cy="120" r="96" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-o="${C*(1-m.T)}"/></svg><div class="c"><b>${Math.round(m.T*100)}</b><span>المؤشر العام %</span></div></div>

<h2 style="margin-top:22px">الطوارئ</h2><p class="sub">وصف الطارئ وحالته فقط.</p>${c.em.map((t,r)=>`<div class="row"><span class="n">${esc(t.n)}</span><button class="st ${t.s?'ok':''}" data-a="ws" data-k="em" data-r="${r}">${t.s?'تم الحل':'قيد المعالجة'}</button><button class="x" data-a="del" data-k="em" data-r="${r}">×</button></div>`).join('')}<div class="add"><input placeholder="طارئ جديد…" data-add="em"></div></section></div>

<section class="glass sec"><h2>مسار الأسابيع</h2><p class="sub">الخط المتصل: المؤشر العام. الخط المتقطع: المعدّل المتحرك لأربعة أسابيع. النقطة المفرغة: الأسبوع الجاري.</p><div class="hist"><svg viewBox="0 0 560 170"><line x1="30" x2="530" y1="${Y(.75)}" y2="${Y(.75)}" stroke="var(--ok)" stroke-dasharray="3 6" opacity=".6"/>${line(pts,'var(--teal)')}${line(ma,'var(--gold)',1)}${pts.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="6" fill="${!c.r&&i===pts.length-1?'var(--bg)':'var(--teal)'}" stroke="var(--teal)" stroke-width="3"/><text x="${X(i)}" y="${Y(v)-12}" text-anchor="middle" font-size="12" fill="var(--ink)">${Math.round(v*100)}</text>`).join('')}</svg></div>
${a.slice().reverse().map(x=>`<div class="hr"><span>${fd(x.d)}</span><div class="bar"><i style="width:${x.t*100}%;background:${ver(x.t)[1]}"></i></div><b>${pc(x.t)}</b></div>`).join('')}
<div class="add"><span style="align-self:center;color:var(--mut);font-size:14px">الأسبوع التالي يبدأ:</span><input type="date" data-nx value="${S.nx||addD(c.s,7)}"><button class="btn gold" data-a="arch">${arm?'اضغط مرة أخرى للتأكيد':'أرشفة الأسبوع وبدء أسبوع جديد'}</button></div></section>`;
}
const $=id=>document.getElementById(id),bm=t=>{$('bm').textContent=t};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,c=S.c,r=+b.dataset.r,i=+b.dataset.i;
if(a==='tk')c.pl[r].d[i]^=1;
else if(a==='dt'){const p=c.pr[r];p.x=p.x===i+1?i:i+1}
else if(a==='pm'){const p=c.pr[r];p.p=Math.max(1,Math.min(7,p.p+ +b.dataset.d));p.x=Math.min(p.x,p.p)}
else if(a==='ws'){const t=c[b.dataset.k][r];t.s^=1}
else if(a==='del'){c[b.dataset.k].splice(r,1)}
else if(a==='tab'){V.v=b.dataset.v;V.open=-1}
else if(a==='rest')c.r^=1;
else if(a==='op'){V.open=V.open===i?-1:i;V.del=-1}
else if(a==='ar')S.a[i].r^=1;
else if(a==='ad'){if(V.del===i){S.a.splice(i,1);V.del=-1;V.open=-1}else V.del=i}
else if(a==='flt')V.f=b.dataset.f;
else if(a==='rw'){S.w=W.slice();S.th=.8;S.m='n'}
else if(a==='nn'){V.dr={id:Date.now(),b:'',p:0,isNew:1}}
else if(a==='no'){V.dr={...S.n.find(y=>y.id==b.dataset.id)}}
else if(a==='nc'){V.dr=null;V.nd=0}
else if(a==='np')V.dr.p^=1;
else if(a==='ns'){const d=V.dr;if(d.b.trim()){const o={id:d.id,b:d.b,p:d.p,u:Date.now()},j=S.n.findIndex(y=>y.id===d.id);j<0?S.n.push(o):S.n[j]=o}V.dr=null}
else if(a==='nd'){if(V.nd){S.n=S.n.filter(y=>y.id!==V.dr.id);V.dr=null;V.nd=0}else V.nd=1}
else if(a==='npj'){const d=V.dr;c.pr.push({n:d.b.trim().split('\n')[0].slice(0,50)||'مشروع جديد',p:3,x:0});V.toast='أُضيف إلى مشاريع أسبوعك';setTimeout(()=>{V.toast='';render()},2200)}
else if(a==='rmt'){S.rm=S.rm||{on:0,t:'21:00'};S.rm.on^=1;applyRm()}
else if(a==='th'){const d=document.documentElement,dk=getComputedStyle(d).colorScheme==='dark';d.dataset.theme=dk?'light':'dark';return}
else if(a==='arch'){if(!arm){arm=1;setTimeout(()=>{arm=0;render()},4000);render();return}arm=0;const m=idx(c);S.a.push({d:c.s,p:m.P,j:m.J,o:m.O,e:m.E,t:m.T,w:S.w.slice(),ap:m.ap,r:c.r,s:JSON.parse(JSON.stringify(c))});let ns=S.nx||addD(c.s,7);if(ns<=c.s)ns=addD(c.s,7);c.s=ns;S.nx='';c.r=0;c.pl.forEach(p=>p.d=Array(7).fill(0));c.pr.forEach(p=>p.x=0);c.wk=c.wk.filter(t=>!t.s);c.em=[];c.rv={w:'',v:''}}
else if(a==='bk'){$('bk').value='';bm('');$('ov').classList.add('s');return}
else if(a==='cls'){$('ov').classList.remove('s');return}
else if(a==='exp'){await shareBackup();return}
else if(a==='imp'){try{const f=$('fi').files[0],o=JSON.parse(f?await f.text():$('bk').value);if(!o.a||!o.c)throw 0;o.n=o.n||[];S=o;save();bm('تمت الاستعادة.');render()}catch(x){bm('الملف أو النص غير صالح.')}return}
save();render()});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key!=='Enter'||!t.dataset.add||!t.value.trim())return;const k=t.dataset.add,v=t.value.trim(),c=S.c;
if(k==='pl')c.pl.push({n:v,d:Array(7).fill(0)});else if(k==='pr')c.pr.push({n:v,p:3,x:0});else c[k].push({n:v,s:0});save();render()});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(d.w!==undefined)S.w[+d.w]=Math.max(0,+t.value||0)/100;else if(d.th!==undefined)S.th=Math.min(1,Math.max(.1,(+t.value||80)/100));else if(d.m)S.m=t.value;else if(d.wd)S.c.s=snapFri(t.value||S.c.s);else if(d.nx!==undefined)S.nx=t.value?snapFri(t.value):'';else if(d.rt!==undefined){S.rm=Object.assign(S.rm||{on:0},{t:t.value});applyRm()}else return;save();render()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.rv){S.c.rv[t.dataset.rv]=t.value;save()}else if(t.dataset.q!==undefined){V.q=t.value;$('nl').innerHTML=nlist()}else if(t.dataset.nb!==undefined)V.dr.b=t.value});
const NM=['الركائز','المشاريع','العمل الرسمي','الطوارئ'];
function archHTML(){const a=S.a.map((x,i)=>({...x,i})),rg=a.filter(x=>!x.r),av=rg.length?rg.reduce((q,x)=>q+x.t,0)/rg.length:0,best=rg.reduce((b,x)=>Math.max(b,x.t),0),L=a.filter(x=>V.f==='all'||(V.f==='r')===!!x.r).reverse();
const card=x=>{const[vt,vc]=ver(x.t),o=V.open===x.i,s=x.s,sw=x.w.reduce((q,y,k)=>q+(x.ap[k]?y:0),0)||1,v=[x.p,x.j,x.o,x.e];
return`<section class="glass sec ${x.r?'rs':''}" style="padding:14px 18px"><div class="row" style="cursor:pointer" data-a="op" data-i="${x.i}"><span class="n"><b>${fd(x.d)} – ${fd(addD(x.d,6))}</b> ${x.r?'<span class="st">🌙 راحة</span>':''}</span><span style="color:${vc};font-size:13px">${vt}</span><b>${pc(x.t)}</b></div>`+(o?`<div style="margin-top:10px">${NM.map((n,k)=>`<div class="hr" style="grid-template-columns:110px 1fr 96px"><span>${n}</span><div class="bar t"><i style="width:${v[k]*100}%;background:${x.ap[k]?'var(--teal)':'var(--line)'}"></i></div><small>${x.ap[k]?pc(v[k])+' · وزن '+pc(x.w[k]/sw):'لم تُحتسب'}</small></div>`).join('')}`+(s?`<h3 style="margin:14px 0 4px;font-size:15px">الركائز</h3>${s.pl.map(p=>`<div class="hr" style="grid-template-columns:150px 1fr 52px"><span>${esc(p.n)}</span><span>${p.d.map(q=>q?'●':'○').join(' ')}</span><b>${pc(p.d.reduce((q,y)=>q+y,0)/7)}</b></div>`).join('')}<h3 style="margin:14px 0 4px;font-size:15px">المشاريع</h3>${s.pr.map(p=>`<div class="row"><span class="n">${esc(p.n)}</span><b>${Math.min(p.x,p.p)}/${p.p}</b></div>`).join('')||'—'}<h3 style="margin:14px 0 4px;font-size:15px">العمل الرسمي</h3>${s.wk.map(p=>`<div class="row"><span class="n">${esc(p.n)}</span><span class="st ${p.s?'ok':''}">${p.s?'منجز':'قيد الانتظار'}</span></div>`).join('')||'—'}<h3 style="margin:14px 0 4px;font-size:15px">الطوارئ</h3>${s.em.map(p=>`<div class="row"><span class="n">${esc(p.n)}</span><span class="st ${p.s?'ok':''}">${p.s?'تم الحل':'قيد المعالجة'}</span></div>`).join('')||'<p class="sub">لا طوارئ.</p>'}${s.rv&&(s.rv.w||s.rv.v)?`<p class="note">${esc(s.rv.w)} ${esc(s.rv.v)}</p>`:''}`:'<p class="sub">لا تتوفر تفاصيل لهذا الأسبوع (أُرشف قبل الترحيل).</p>')+`<div class="add"><button class="st ${x.r?'ok':''}" data-a="ar" data-i="${x.i}">🌙 أسبوع راحة</button><button class="st" data-a="ad" data-i="${x.i}">${V.del===x.i?'تأكيد الحذف':'حذف'}</button></div></div>`:'')+'</section>'};
return`<section class="glass sec"><h2>الأرشيف</h2><p class="sub">أسابيع الراحة تظهر باهتة ولا تدخل في المعدّل ولا الأفضل ولا السلسلة.</p><div class="chips"><div class="chip"><b>${rg.length}</b><small>أسابيع عمل</small></div><div class="chip"><b>${a.length-rg.length}</b><small>أسابيع راحة</small></div><div class="chip"><b>${pc(av)}</b><small>المعدّل العام</small></div><div class="chip"><b>${pc(best)}</b><small>أفضل أسبوع</small></div></div><div class="add">${[['all','الكل'],['n','العمل'],['r','الراحة']].map(([k,n])=>`<button class="btn ${V.f===k?'gold':''}" data-a="flt" data-f="${k}">${n}</button>`).join('')}</div></section>`+L.map(card).join('')}
function setHTML(){const m=idx(S.c);return`<section class="glass sec"><h2>أوزان المؤشرات</h2><p class="sub">أدخل أي أرقام وتُحسب النسب الفعلية تلقائياً. أي محور بلا عناصر في الأسبوع يُستثنى ويُعاد توزيع وزنه على الباقي. الأسابيع المؤرشفة تحتفظ بأوزانها وقت الأرشفة.</p>${NM.map((n,k)=>`<div class="row"><span class="n">${n}</span><input type="number" min="0" max="100" value="${Math.round(S.w[k]*100)}" data-w="${k}"><b style="width:60px;text-align:center">${m.ap[k]?pc(m.ew[k]):'—'}</b></div>`).join('')}</section>
<section class="glass sec"><h2>القواعد</h2><div class="row"><span class="n">حدّ الركائز (للسلسلة والمراجعة)</span><input type="number" min="10" max="100" value="${Math.round(S.th*100)}" data-th> %</div><div class="row"><span class="n">عند غياب الطوارئ</span><select data-m><option value="n" ${S.m==='n'?'selected':''}>غير مُحتسبة (مقترح)</option><option value="1" ${S.m==='1'?'selected':''}>تُحتسب 100%</option></select></div><div class="add"><button class="btn" data-a="rw">استعادة الافتراضي</button></div></section><section class="glass sec"><h2>التذكير اليومي</h2><p class="sub">إشعار يومي يذكّرك بتسجيل ركائزك.${CP.LocalNotifications?'':' (يعمل داخل التطبيق المثبّت فقط)'}</p><div class="row"><span class="n">تفعيل التذكير</span><button class="st ${S.rm&&S.rm.on?'ok':''}" data-a="rmt">${S.rm&&S.rm.on?'مفعّل':'معطّل'}</button></div><div class="row"><span class="n">الوقت</span><input type="time" data-rt value="${(S.rm||{}).t||'21:00'}"></div></section>`}
function nlist(){const q=(V.q||'').trim(),L=S.n.filter(x=>!q||x.b.includes(q)).sort((a,b)=>(b.p-a.p)||(b.u-a.u));return L.map(x=>`<div class="nt" data-a="no" data-id="${x.id}"><p>${x.p?'📌 ':''}${esc(x.b)}</p><small style="color:var(--mut)">${fd(new Date(x.u).toISOString().slice(0,10))}</small></div>`).join('')||'<p class="sub" style="text-align:center;margin:30px 0">لا شيء هنا بعد. اضغط ＋ واكتب ما يخطر ببالك.</p>'}
function notesHTML(){return`<section class="glass sec"><input placeholder="بحث…" data-q value="${esc(V.q||'')}" style="width:100%;margin-bottom:12px;padding:10px 14px"><div id="nl">${nlist()}</div></section>`}
const sheetHTML=()=>{const d=V.dr;return`<div class="sheet"><div class="add" style="margin:0 0 6px"><button class="btn" data-a="nc">رجوع</button><button class="btn gold" data-a="ns">حفظ</button><button class="st ${d.p?'ok':''}" data-a="np" style="margin-inline-start:auto">📌</button></div><textarea data-nb placeholder="اكتب بحرّية…">${esc(d.b)}</textarea><div class="add" style="margin:6px 0 0"><button class="st" data-a="npj">🚀 حوّلها إلى مشروع</button>${d.isNew?'':`<button class="st" data-a="nd">${V.nd?'تأكيد الحذف':'حذف'}</button>`}</div></div>`};
function render(){const v=V.v;document.getElementById('app').innerHTML=`<nav class="tabs">${[['w','الأسبوع'],['n','الدفتر'],['a','الأرشيف'],['s','الإعدادات']].map(([k,n])=>`<button class="btn ${v===k?'gold':''}" data-a="tab" data-v="${k}">${n}</button>`).join('')}</nav>`+(v==='a'?archHTML():v==='s'?setHTML():v==='n'?notesHTML():weekHTML())+(v==='n'&&!V.dr?'<button class="fab" data-a="nn">＋</button>':'')+(V.dr?sheetHTML():'')+(V.toast?`<div class="toast">${V.toast}</div>`:'');requestAnimationFrame(()=>{const e=document.querySelector('.arc');if(e)e.style.strokeDashoffset=e.dataset.o})}
render();boot();
</script></body></html>
