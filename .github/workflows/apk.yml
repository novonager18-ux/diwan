name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files and icons
        run: |
          mkdir -p www assets
          cp index.html www/
          cp icon-only.png icon-foreground.png icon-background.png splash.png assets/
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - name: Allow notifications permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: diwan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
